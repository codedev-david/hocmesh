name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
            archive: tar.gz
            features: hocmesh-gpu/cuda,hocmesh-gpu/rocm
          - os: windows-latest
            target: windows-x86_64
            archive: zip
            features: hocmesh-gpu/cuda
          - os: macos-latest
            target: macos-arm64
            archive: tar.gz
            features: hocmesh-gpu/metal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      # hocmesh-desktop links a webview and a tray, so a whole-workspace build
      # needs GTK and WebKit present. Windows and macOS carry theirs already.
      - name: Install desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - name: Build release binaries
        run: cargo build --release --workspace --features ${{ matrix.features }} --locked
      - name: Assemble release folder
        shell: pwsh
        run: |
          $dist = "hocmesh-${{ github.event.inputs.version || github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force $dist, "$dist/docs", "$dist/config" | Out-Null
          Copy-Item README.md, CODEX_HANDOFF.md, LICENSE, VERSION -Destination $dist
          Copy-Item docs/*.md -Destination "$dist/docs"
          Copy-Item config/*.json -Destination "$dist/config"
          if (Test-Path target/release/hocmesh.exe) {
            Copy-Item target/release/hocmesh.exe, target/release/hocmesh-coordinator.exe, target/release/hocmesh-validator.exe -Destination $dist
          } else {
            Copy-Item target/release/hocmesh, target/release/hocmesh-coordinator, target/release/hocmesh-validator -Destination $dist
          }
          "DIST=$dist" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Create archive
        shell: pwsh
        run: |
          if ("${{ matrix.archive }}" -eq "zip") {
            Compress-Archive -Path "$env:DIST/*" -DestinationPath "$env:DIST.zip"
            "ARCHIVE=$env:DIST.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            tar -czf "$env:DIST.tar.gz" "$env:DIST"
            "ARCHIVE=$env:DIST.tar.gz" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
      - name: Build Linux installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          installer=$(./scripts/package-linux.sh target/release/hocmesh "${{ github.event.inputs.version || github.ref_name }}" dist amd64 | tail -1)
          echo "INSTALLER=$installer" >> "$GITHUB_ENV"
          rpm_installer=$(./scripts/package-linux-rpm.sh target/release/hocmesh "${{ github.event.inputs.version || github.ref_name }}" dist x86_64 | tail -1)
          echo "RPM_INSTALLER=$rpm_installer" >> "$GITHUB_ENV"
      - name: Build macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          installer=$(./scripts/package-macos.sh target/release/hocmesh "${{ github.event.inputs.version || github.ref_name }}" dist | tail -1)
          echo "INSTALLER=$installer" >> "$GITHUB_ENV"
      - name: Install WiX
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix --version 6.0.2
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version || github.ref_name }}"
          ./scripts/package-windows.ps1 -Binary target/release/hocmesh.exe -Version $version -OutputDirectory dist
          $installer = (Resolve-Path "dist/hocmesh-$($version.TrimStart('v'))-x86_64.msi").Path
          "INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build desktop installers (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./scripts/package-desktop.sh target/release/hocmesh "${{ github.event.inputs.version || github.ref_name }}" dist
      - name: Build desktop installers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package-desktop.ps1 -Binary target/release/hocmesh.exe `
            -Version "${{ github.event.inputs.version || github.ref_name }}" -OutputDirectory dist
      # Signed before the checksums are taken, so the published digest is the
      # digest of the file people will actually run.
      - name: Sign artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./scripts/sign-artifacts.ps1 -Directory dist
      - name: Sign artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: ./scripts/sign-artifacts.sh dist
      - name: Generate checksums
        shell: pwsh
        run: |
          $desktop = Get-ChildItem dist -Filter 'hocmesh-desktop*' -File | ForEach-Object { $_.FullName }
          if (-not $desktop) { throw "no desktop installer was produced" }
          $headless = @($env:ARCHIVE, $env:INSTALLER, $env:RPM_INSTALLER) | Where-Object { $_ }
          foreach ($artifact in $headless + $desktop) {
            $hash = Get-FileHash -Algorithm SHA256 $artifact
            "$($hash.Hash.ToLowerInvariant())  $(Split-Path -Leaf $artifact)" | Out-File -Encoding ascii "$artifact.sha256"
          }
      # Linux has no per-file signature format everyone checks, so the
      # checksum list is what gets signed; verifying it verifies every artifact.
      - name: Sign checksums (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          ./scripts/sign-artifacts.sh dist
          ./scripts/sign-artifacts.sh "$(dirname "$ARCHIVE")"
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: hocmesh-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
            ${{ env.ARCHIVE }}.sha256.asc
            ${{ env.INSTALLER }}
            ${{ env.INSTALLER }}.sha256
            ${{ env.INSTALLER }}.sha256.asc
            dist/hocmesh-*.rpm
            dist/hocmesh-*.rpm.sha256
            dist/hocmesh-*.rpm.sha256.asc
            dist/hocmesh-desktop*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      # The release body is the changelog section for this version, so what a
      # release says and what the repository says cannot drift apart. A tag
      # with no section gets a pointer rather than an empty release.
      - name: Take the release notes from the changelog
        shell: bash
        run: |
          version="${{ github.event.inputs.version || github.ref_name }}"
          # Compare the version alone rather than a heading prefix: a prefix
          # match would hand v0.4.1 the notes for v0.4.10.
          awk -v want="${version#v}" '
            /^## / { found = $2; sub(/^v/, "", found); inside = (found == want); if (inside) next }
            inside { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section for $version; see the repository history." > notes.md
          fi
          cat notes.md
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: hocMESH ${{ github.event.inputs.version || github.ref_name }}
          body_path: notes.md
          draft: true
          prerelease: true
          files: |
            artifacts/**/*.{zip,tar.gz,msi,exe,pkg,deb,rpm,dmg,AppImage,sha256,asc}
