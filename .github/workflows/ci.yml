name: ci

on:
  push:
    # Branches only. Without this a `v*` tag push runs the whole of CI a
    # second time alongside the release workflow, and the two then compete
    # for the same runners -- which is how the desktop packaging job kept
    # getting starved out of the runs that were meant to validate it.
    branches: ['**']
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      # hocmesh-desktop links a webview and a tray, so a whole-workspace build
      # needs GTK and WebKit present. Windows and macOS carry theirs already.
      - name: Install desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libappindicator3-dev librsvg2-dev patchelf
      # A script a workflow runs as ./scripts/x.sh has to be executable in the
      # index, and a Windows checkout cannot tell you it is not: the file is
      # committed 100644, every local run works because it is invoked through
      # bash, and the release fails on macOS a quarter of an hour in. Two
      # seconds here instead.
      - name: Workflow scripts are executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bad=0
          # Comments are stripped first, so the one above this step does not
          # report itself.
          invoked=$(cat .github/workflows/*.yml | grep -v '^[[:space:]]*#' |
                    grep -oE '\./scripts/[A-Za-z0-9_-]+\.sh' | sort -u)
          for script in $invoked; do
            mode=$(git ls-files -s "${script#./}" | cut -d' ' -f1)
            if [ "$mode" != "100755" ]; then
              echo "$script is invoked directly by a workflow but is committed $mode; run: git update-index --chmod=+x ${script#./}" >&2
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] && echo "Every directly-invoked workflow script is executable."
          exit "$bad"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-features --locked
      - name: Test
        run: cargo test --workspace --all-features --locked --exclude hocmesh-integration-tests
      - name: Integration tests
        # Every one of these stands up a four-validator quorum and at least
        # one coordinator, and several of them are timing tests. Run them one
        # at a time: a two-core runner that is hosting two such stacks starves
        # the very timeouts under test.
        run: cargo test -p hocmesh-integration-tests --all-features --locked -- --test-threads=1
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Proofs
        run: |
          cargo run --release --locked -p hocmesh-core --example verification_proof
          cargo run --release --locked -p hocmesh-core --example float_witness_proof

  supply-chain:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Install cargo audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit dependencies
        run: cargo audit
      - name: Install cargo deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check dependency policy
        run: cargo deny check
      - name: Install cargo cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Generate SBOM
        run: |
          cargo cyclonedx --all --all-features --format json --override-filename hocmesh-sbom
          mkdir -p target/sbom
          count=0
          for bom in crates/*/hocmesh-sbom.json; do
            test -s "$bom"
            jq -e '.bomFormat == "CycloneDX" and (.metadata.component.name | length > 0) and (.dependencies | length > 0)' "$bom" >/dev/null
            crate=$(basename "$(dirname "$bom")")
            mv "$bom" "target/sbom/$crate.cdx.json"
            count=$((count + 1))
          done
          test "$count" -eq 12
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: hocmesh-workspace-sbom-cyclonedx-json
          path: target/sbom/*.cdx.json
          if-no-files-found: error

  coverage:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Measure workspace coverage
        run: cargo llvm-cov --workspace --all-features --locked --lcov --output-path target/hocmesh-coverage.lcov --fail-under-lines 45 -- --test-threads=1
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: hocmesh-coverage-lcov
          path: target/hocmesh-coverage.lcov
          if-no-files-found: error

  loadtest:
    # The unit and integration suites prove each piece behaves; this proves the
    # pieces still behave when they are all busy at once. Every hard bug this
    # ledger has had was a race, and a race needs contention -- a whole network
    # under simultaneous load is the only place it shows up.
    #
    # It fails on unsettled work, on CU that do not add up, or on a ledger that
    # will not re-audit from genesis. It deliberately does not fail on being
    # slow: a latency threshold on a shared CI runner is a flaky test, and a
    # flaky test teaches people to ignore red.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Build the three binaries a network needs
        run: cargo build --release --locked -p hocmesh -p hocmesh-coordinator -p hocmesh-validator
      - name: Load test a whole local network
        run: ./scripts/loadtest-local.sh --skip-build --jobs 24 --concurrency 8 --shards 4 --json target/loadtest-report.json
      - name: Upload the report
        # Kept even when the run failed: the report is the evidence, and a
        # failure is exactly when someone wants to read it.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hocmesh-loadtest-report
          path: |
            target/loadtest-report.json
            target/loadtest/*.log
          if-no-files-found: warn

  gpu-backend-contracts:
    strategy:
      matrix:
        include:
          - os: windows-latest
            feature: cuda
          - os: ubuntu-latest
            feature: cuda
          - os: ubuntu-latest
            feature: rocm
          - os: macos-latest
            feature: metal
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Compile backend adapter
        run: cargo check -p hocmesh-gpu --features ${{ matrix.feature }} --locked
      - name: Test backend contract
        run: cargo test -p hocmesh-gpu --features ${{ matrix.feature }} --locked

  native-installers:
    strategy:
      # One platform's packaging break must not cancel the other two before
      # they have said whether they work.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            kind: deb
            features: hocmesh-gpu/cuda,hocmesh-gpu/rocm
          - os: windows-latest
            kind: msi
            features: hocmesh-gpu/cuda
          - os: macos-latest
            kind: pkg
            features: hocmesh-gpu/metal
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      # The whole peer: node, coordinator and validator. All three packagers
      # refuse to build unless the coordinator and the validator are sitting
      # beside the node. Not `--workspace`: that would drag in the desktop
      # crate and its GTK and WebKit toolchain for an installer that carries
      # no window.
      - name: Build peer
        run: cargo build --release -p hocmesh -p hocmesh-coordinator -p hocmesh-validator --features ${{ matrix.features }} --locked
      - name: Install WiX
        if: matrix.kind == 'msi'
        run: dotnet tool install --global wix --version 6.0.2
      - name: Build and validate DEB
        if: matrix.kind == 'deb'
        shell: bash
        run: ./scripts/package-linux.sh target/release/hocmesh "$(cat VERSION)" dist amd64
      # rpmbuild is not on the image, and neither is cpio, which is what
      # unpacks the result below.
      - name: Install RPM tooling
        if: matrix.kind == 'deb'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm cpio
      - name: Build and validate RPM
        if: matrix.kind == 'deb'
        shell: bash
        run: ./scripts/package-linux-rpm.sh target/release/hocmesh "$(cat VERSION)" dist x86_64
      - name: Build and validate PKG
        if: matrix.kind == 'pkg'
        shell: bash
        run: ./scripts/package-macos.sh target/release/hocmesh "$(cat VERSION)" dist
      - name: Build and validate MSI
        if: matrix.kind == 'msi'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Binary target/release/hocmesh.exe -Version (Get-Content VERSION -Raw).Trim() -OutputDirectory dist
      - name: Execute peer extracted from DEB
        if: matrix.kind == 'deb'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/hocmesh-deb"
          dpkg-deb --extract dist/*.deb "$RUNNER_TEMP/hocmesh-deb"
          "$RUNNER_TEMP/hocmesh-deb/usr/bin/hocmesh" --version
      - name: Execute peer extracted from RPM
        if: matrix.kind == 'deb'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/hocmesh-rpm"
          (cd "$RUNNER_TEMP/hocmesh-rpm" && rpm2cpio "$GITHUB_WORKSPACE"/dist/*.rpm | cpio -idm)
          "$RUNNER_TEMP/hocmesh-rpm/usr/bin/hocmesh" --version
      - name: Execute peer extracted from PKG
        if: matrix.kind == 'pkg'
        shell: bash
        run: |
          pkgutil --expand-full dist/*.pkg "$RUNNER_TEMP/hocmesh-pkg"
          peer=$(find "$RUNNER_TEMP/hocmesh-pkg" -type f -path '*/usr/local/bin/hocmesh' -print -quit)
          test -n "$peer"
          "$peer" --version
      - name: Execute peer extracted from MSI
        if: matrix.kind == 'msi'
        shell: pwsh
        run: |
          $msi = (Resolve-Path dist/*.msi).Path
          $extract = Join-Path $env:RUNNER_TEMP "hocmesh-msi"
          $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/a', $msi, '/qn', "TARGETDIR=$extract")
          if ($process.ExitCode -ne 0) { throw "MSI administrative extraction failed: $($process.ExitCode)" }
          $peer = Get-ChildItem $extract -Filter hocmesh.exe -Recurse | Select-Object -First 1
          if (-not $peer) { throw "hocmesh.exe is absent from MSI" }
          & $peer.FullName --version
      - name: Smoke-test packaged peer
        shell: pwsh
        run: |
          $artifact = Get-ChildItem dist -File | Select-Object -First 1
          if (-not $artifact -or $artifact.Length -le 0) { throw "installer artifact is missing or empty" }
          Get-FileHash -Algorithm SHA256 $artifact.FullName
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: hocmesh-headless-${{ matrix.kind }}
          path: dist/*
          if-no-files-found: error

  desktop-installers:
    strategy:
      # One platform's packaging break must not cancel the other two before
      # they have said whether they work.
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than latest: linuxdeploy is itself an AppImage, so
          # bundling one needs FUSE, which 24.04 runners no longer ship.
          - os: ubuntu-22.04
            kind: linux
          - os: windows-latest
            kind: windows
          - os: macos-latest
            kind: macos
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Install desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libappindicator3-dev librsvg2-dev patchelf rpm
      # The whole peer the app drives, shipped inside the same installer: node,
      # coordinator and validator. Built here so the window and the daemons it
      # starts come from one build. Not `--workspace`, which would rebuild the
      # desktop crate twice -- `cargo tauri build` compiles it below.
      - name: Build peer binaries
        run: cargo build --release -p hocmesh -p hocmesh-coordinator -p hocmesh-validator --locked
      - name: Build desktop installers (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/package-desktop.sh target/release/hocmesh "$(cat VERSION)" dist
      - name: Build desktop installers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-desktop.ps1 -Binary target/release/hocmesh.exe -Version (Get-Content VERSION -Raw).Trim() -OutputDirectory dist
      # Each script opens what it produced and checks the node is inside; this
      # is the cheap outer guard that something was produced at all.
      - name: Smoke-test desktop installers
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem dist -File
          if (-not $artifacts) { throw "no desktop installer was produced" }
          foreach ($artifact in $artifacts) {
            if ($artifact.Length -le 0) { throw "$($artifact.Name) is empty" }
            Get-FileHash -Algorithm SHA256 $artifact.FullName
          }
      - name: Upload desktop installers
        uses: actions/upload-artifact@v7
        with:
          name: hocmesh-desktop-${{ matrix.kind }}
          path: dist/*
          if-no-files-found: error
