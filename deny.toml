[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = [
    # Unsoundness in glib::VariantStrIter's Iterator impls, fixed in glib
    # 0.20. glib reaches this workspace only at 0.18.5, through the GTK3
    # stack that Tauri's Linux webview is built on, and gtk3-rs ended at
    # 0.18 -- so there is no version of this dependency tree that carries the
    # fix while Tauri v2 uses GTK3. Nothing here constructs or iterates a
    # glib Variant; it is unreachable from hocMESH code, and it is scoped to
    # Linux desktop builds only. Revisit when Tauri moves to GTK4.
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18 is pinned by Tauri's GTK3 webview; VariantStrIter is never reached from this workspace" },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# Named one crate at a time rather than added to `allow` above. MPL-2.0 is
# file-level copyleft: linking these unmodified is compliant, but a blanket
# allow would silently admit the next MPL dependency too, including one this
# workspace might actually want to patch. All six arrive through Tauri --
# five in the webview's CSS engine, one in its build script.
[[licenses.exceptions]]
name = "cssparser"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "cssparser-macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "dtoa-short"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "selectors"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "option-ext"
allow = ["MPL-2.0"]

# Apache-2.0 is already allowed; the LLVM exception only relaxes it further,
# but SPDX makes it a distinct expression, so it has to be named.
[[licenses.exceptions]]
name = "target-lexicon"
allow = ["Apache-2.0 WITH LLVM-exception"]

# The workspace's own crates are proprietary and `publish = false`. There is
# no SPDX identifier to allow -- `LicenseRef-hocMESH-Proprietary` is a
# LicenseRef by construction -- and this check exists to police third-party
# dependencies, which it still does.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
