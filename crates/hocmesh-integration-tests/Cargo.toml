[package]
name = "hocmesh-integration-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dev-dependencies]
anyhow.workspace = true
hocmesh = { path = "../hocmesh-node" }
hocmesh-ai = { path = "../hocmesh-ai" }
# Without `gui`: these tests drive the desktop app's own logic against a real
# daemon, and linking a webview to do it would make them unrunnable on a
# headless machine for no gain.
hocmesh-desktop = { path = "../hocmesh-desktop", default-features = false }
hocmesh-core = { path = "../hocmesh-core" }
hocmesh-gpu = { path = "../hocmesh-gpu" }
hocmesh-model = { path = "../hocmesh-model" }
hocmesh-ledger = { path = "../hocmesh-ledger" }
hocmesh-protocol = { path = "../hocmesh-protocol" }
rusqlite.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
