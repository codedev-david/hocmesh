[workspace]
members = [
    "crates/hocmesh-protocol",
    "crates/hocmesh-core",
    "crates/hocmesh-ledger",
    "crates/hocmesh-node",
    "crates/hocmesh-coordinator",
    "crates/hocmesh-validator",
    "crates/hocmesh-integration-tests",
    "crates/hocmesh-model",
    "crates/hocmesh-gpu",
    "crates/hocmesh-ai",
    "crates/hocmesh-transport",
    "crates/hocmesh-desktop",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
authors = ["hocMESH Contributors"]
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8.9"
base64 = "0.22"
argon2 = "0.5"
chacha20poly1305 = "0.10"
clap = { version = "4.6.6", features = ["derive"] }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.13.4", features = ["json"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["v4"] }
async-trait = "0.1"
bytes = "1.10"
flate2 = "1.1"
tar = "0.4"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
